name: Dev CI

# Development/integration validation.
# Runs on pushes to `dev` and on pull requests targeting the protected `main`.
# It never deploys, never SSHes to EC2 and never publishes images to GHCR.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

# Least privilege: development CI only reads the repository.
permissions:
  contents: read

concurrency:
  # github.head_ref is set for pull_request events, github.ref_name for pushes,
  # so runs for the same source branch share one group and obsolete runs cancel.
  group: dev-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff + security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run bandit -r app -q --severity-level medium
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:security

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject committed credential formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}'
          if git grep -n -I -E "$pattern" -- .; then
            echo "::error::A likely credential or private key is committed in the current tree."
            exit 1
          fi
          if git log --all -p --no-ext-diff -- . | grep -n -E "$pattern"; then
            echo "::error::A likely credential or private key exists in Git history. Rotate it and purge the history."
            exit 1
          fi

  # Verify both images build (no push, no registry login).
  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
            NUXT_PUBLIC_CSRF_COOKIE_NAME=__Host-XSRF-TOKEN
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single aggregate check to require in the `main` branch protection ruleset
  # (status check name: "Dev CI").
  dev-ci-ok:
    name: Dev CI
    needs: [backend, frontend, secrets, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} secrets=${{ needs.secrets.result }} docker=${{ needs.docker.result }}"
          for result in \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.secrets.result }}" \
            "${{ needs.docker.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required Dev CI job did not succeed."
              exit 1
            fi
          done
          echo "All Dev CI checks passed."
