name: Dev CI

# Development/integration validation.
# Runs on pushes to `dev` and on pull requests targeting the protected `main`.
# It never deploys, never SSHes to the Hostinger VPS and never publishes images to GHCR.
#
# The `changes` job classifies what a push touched and the component jobs are
# skipped when their area did not change (a docs-only push finishes in about a
# minute instead of running the whole backend suite). Skipping is explicit and
# the aggregate `Dev CI` job still fails when a component that *should* have
# run fails, so branch protection keeps its single required status check.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

# Least privilege: development CI only reads the repository.
permissions:
  contents: read

concurrency:
  # github.head_ref is set for pull_request events, github.ref_name for pushes.
  # The event name is part of the group on purpose: a push to `dev` and a PR
  # from `dev` targeting `main` are *different* checks of the same branch, and
  # the branch ruleset on `main` requires the pull_request run of `Dev CI`. Let
  # one of them cancel the other and the required check turns up
  # cancelled/failed on an otherwise-green head, which blocks the merge.
  # Only same-branch, same-event runs are "outdated" and may cancel.
  group: dev-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/dev-ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/dev-ci.yml'
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'infrastructure/docker-compose.yml'
              - 'infrastructure/docker-compose.prod.yml'
              - 'infrastructure/nginx/**'
              - '.github/workflows/dev-ci.yml'

  backend:
    name: Backend (pytest + ruff + security)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      # The suite is sharded across CPU cores (pytest-xdist): the tests are
      # independent — each one builds its own database — so this divides the
      # wall-clock time without touching the tests themselves.
      - run: uv run pytest -q -n auto
      - run: uv run ruff check .
      # Dependency and source audits run in the scheduled `Security audit`
      # workflow (weekly and on PRs into `main`); duplicating pip-audit on
      # every dev push added minutes without adding a check the scheduled run
      # would miss.
      - run: uv run bandit -r app -q --severity-level medium

  frontend:
    name: Frontend (lint + typecheck + test)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject committed credential formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}'
          if git grep -n -I -E "$pattern" -- .; then
            echo "::error::A likely credential or private key is committed in the current tree."
            exit 1
          fi
          if git log --all -p --no-ext-diff -- . | grep -n -E "$pattern"; then
            echo "::error::A likely credential or private key exists in Git history. Rotate it and purge the history."
            exit 1
          fi

  # Verify both images build (no push, no registry login). Only relevant when an
  # image's inputs (Dockerfile, manifest, compose, nginx) changed.
  docker:
    name: Docker build validation
    needs: [changes]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
            NUXT_PUBLIC_CSRF_COOKIE_NAME=__Host-XSRF-TOKEN
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single aggregate check to require in the `main` branch protection ruleset
  # (status check name: "Dev CI"). A component job is allowed to be `skipped`
  # only when the change classification says its area did not change.
  dev-ci-ok:
    name: Dev CI
    needs: [changes, backend, frontend, secrets, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          echo "backend=${{ needs.backend.result }} (changed=${{ needs.changes.outputs.backend }}) frontend=${{ needs.frontend.result }} (changed=${{ needs.changes.outputs.frontend }}) secrets=${{ needs.secrets.result }} docker=${{ needs.docker.result }} (changed=${{ needs.changes.outputs.docker }})"

          check() {
            job_result="$1"
            area_changed="$2"
            job_name="$3"
            if [ "$job_result" != "success" ]; then
              if [ "$job_result" = "skipped" ] && [ "$area_changed" != "true" ]; then
                return 0
              fi
              echo "::error::Required Dev CI job did not succeed: $job_name ($job_result)."
              exit 1
            fi
          }

          check "${{ needs.backend.result }}" "${{ needs.changes.outputs.backend }}" "backend"
          check "${{ needs.frontend.result }}" "${{ needs.changes.outputs.frontend }}" "frontend"
          check "${{ needs.docker.result }}" "${{ needs.changes.outputs.docker }}" "docker"
          if [ "${{ needs.secrets.result }}" != "success" ]; then
            echo "::error::Required Dev CI job did not succeed: secrets."
            exit 1
          fi
          echo "All Dev CI checks passed."