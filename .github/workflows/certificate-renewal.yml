name: Renew production certificate

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-certificate
  cancel-in-progress: false

jobs:
  renew:
    name: Renew certificate on Hostinger VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      # Same connection values and legacy fallbacks as the deploy workflow.
      VPS_HOST: ${{ vars.VPS_HOST || vars.AWS_HOST || secrets.VPS_HOST || secrets.AWS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || vars.AWS_USER || secrets.VPS_USER || secrets.AWS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || vars.AWS_PORT || secrets.VPS_PORT || secrets.AWS_PORT || 22 }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.AWS_SSH_KEY }}
      VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT || vars.AWS_HOST_FINGERPRINT }}
    steps:
      # Same host-key pin as the deploy pipeline; never renew against an
      # unverified host.
      - name: Verify VPS SSH host key
        env:
          HOST: ${{ env.VPS_HOST }}
          PORT: ${{ env.VPS_PORT }}
          FINGERPRINT: ${{ env.VPS_HOST_FINGERPRINT }}
        run: |
          set -eu
          if [ -z "$FINGERPRINT" ]; then
            echo "Missing variable VPS_HOST_FINGERPRINT." >&2
            exit 1
          fi
          scan="$(mktemp)"
          ssh-keyscan -p "$PORT" "$HOST" > "$scan" 2>/dev/null
          if [ ! -s "$scan" ]; then
            echo "Could not reach the VPS SSH port ${PORT}." >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$scan" | grep "$FINGERPRINT" | grep -q "(ED25519)"; then
            echo "SSH host key fingerprint mismatch for ${HOST}. Renewal aborted." >&2
            exit 1
          fi
          echo "SSH host key verified: $FINGERPRINT"

      - name: Renew Let's Encrypt certificate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -euo pipefail
            cd /opt/lcs
            if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -E docker"; fi
            $DOCKER compose -f docker-compose.prod.yml --profile tools run --rm certbot \
              renew --webroot -w /var/www/certbot --quiet
            $DOCKER compose -f docker-compose.prod.yml exec -T frontend nginx -s reload
