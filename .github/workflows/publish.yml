name: Build & Deploy

on:
  # Only the default branch and release tags build/publish/deploy.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (e.g. latest or sha-1a2b3c4)
        required: false
        default: latest

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Reuse the full CI suite; images are only built if every check passes.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }} image
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to AWS
    needs: [build]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull new images and restart the stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd /opt/freight-forwarding
            git pull --ff-only
            cd infrastructure

            # Authenticate to GHCR (private packages). Prefer a read:packages PAT,
            # fall back to the workflow token.
            GHCR_PASSWORD='${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}'
            echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            export IMAGE_TAG
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # Fail the deploy if the API is not healthy through nginx.
            sleep 15
            curl -fsS https://lcslog.minidev.in/health/ready \
              || curl -fsS http://lcslog.minidev.in/health/ready
