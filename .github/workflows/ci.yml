name: CI

on:
  # Validate feature branches on push and on pull requests. Both events share a
  # concurrency group per source branch so an outdated run is cancelled.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
# (The "changes" job additionally requests pull-requests: read.)
permissions:
  contents: read

concurrency:
  # github.head_ref is set for pull_request events, github.ref_name for pushes,
  # so push and pull-request runs for the same branch share one group.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Needed for push events (paths-filter uses git there).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Shared/workflow/infra changes affect both sides, so they run both.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'infrastructure/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
              - 'infrastructure/**'

  backend:
    name: Backend (ruff + pytest)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend (lint + typecheck + test)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Single aggregate check to require in branch protection (job name: "CI").
  # It succeeds when the checks that applied to the changed paths passed, even
  # if the other side was intentionally skipped by the path filter.
  ci-ok:
    name: CI
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed."
              exit 1
            fi
          done
          echo "All required checks passed (intentionally skipped jobs are allowed)."
