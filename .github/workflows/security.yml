name: Security audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --extra dev
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt
      - run: uv run bandit -r app -q --severity-level medium

  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:security

  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject common committed secret formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,}'
          if git grep -n -I -E "$pattern" -- .; then
            echo "::error::A likely credential or private key is committed in the current tree."
            exit 1
          fi
          if git log --all -p --no-ext-diff -- . | grep -n -E "$pattern"; then
            echo "::error::A likely credential or private key exists in Git history. Rotate it and purge the history."
            exit 1
          fi

  security-audit-ok:
    name: Security Audit
    needs: [backend-dependencies, frontend-dependencies, secret-patterns]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify security jobs
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.backend-dependencies.result }}" \
            "${{ needs.frontend-dependencies.result }}" \
            "${{ needs.secret-patterns.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required security job did not succeed."
              exit 1
            fi
          done
