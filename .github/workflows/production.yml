name: Production

# Production pipeline. Triggers only from `main` (push or manual dispatch).
# A push to `dev` can never reach this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing immutable image tag to deploy (e.g. sha-c1ccaf8). Leave empty to build from this commit.'
        required: false
        default: ''

# Least privilege by default; only the build job may publish images.
permissions:
  contents: read

# Only one production run at a time; never cancel an in-progress deployment.
concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Decide what to deploy: a fresh immutable sha tag, or a manually supplied
  # existing tag (rollback / redeploy without rebuilding).
  resolve:
    name: Resolve deployment tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "Manual deployment of existing image: $INPUT_TAG"
            echo "image_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # 1. Validate/test the exact production commit.
  validate-backend:
    name: Production backend validation
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  validate-frontend:
    name: Production frontend validation
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # 2-5. Build both images, tag with the immutable commit SHA and push to GHCR.
  # No environment: the frontend build only needs the repository-level
  # NUXT_PUBLIC_SITE_URL variable.
  build:
    name: Build ${{ matrix.name }} image
    needs: [resolve, validate-backend, validate-frontend]
    if: >-
      always() &&
      needs.resolve.outputs.build == 'true' &&
      needs.validate-backend.result == 'success' &&
      needs.validate-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 6-13. Transfer ONLY the runtime files, generate .env, back up PostgreSQL,
  # deploy the exact SHA-tagged images and verify HTTPS readiness.
  #
  # EC2 is a Docker runtime host: it does NOT hold the Git repository and never
  # runs git clone/pull/fetch/reset. The runtime directory is /opt/lcs.
  deploy:
    name: Deploy to AWS
    needs: [resolve, validate-backend, validate-frontend, build]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (
        (needs.resolve.outputs.build == 'true' && needs.build.result == 'success') ||
        (needs.resolve.outputs.build == 'false' && needs.build.result == 'skipped')
      ) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    # Production secrets/variables are only needed here.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ensure the runtime directory exists and is writable by the deploy user.
      - name: Prepare runtime directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_DIR: /opt/lcs
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            if mkdir -p "$DEPLOY_DIR/nginx" 2>/dev/null; then
              echo "Runtime directory ready: $DEPLOY_DIR"
            elif sudo -n mkdir -p "$DEPLOY_DIR/nginx" 2>/dev/null; then
              sudo -n chown -R "$(id -u):$(id -g)" "$DEPLOY_DIR"
              echo "Runtime directory ready (via sudo): $DEPLOY_DIR"
            else
              echo "Cannot create $DEPLOY_DIR; create it and chown it to the deploy user." >&2
              exit 1
            fi

      # Copy only the runtime bundle: compose.yml + nginx/production.conf.
      - name: Upload runtime files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          source: "deploy/compose.yml,infrastructure/nginx/production.conf"
          target: /opt/lcs
          strip_components: 1
          overwrite: true

      # Generate the runtime .env atomically, back up PostgreSQL, then pull the
      # exact immutable (public) images and recreate the stack.
      - name: Deploy ${{ needs.resolve.outputs.image_tag }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_DIR: /opt/lcs
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'freight' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'freight' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER || 'minioadmin' }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'freight-attachments' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_PUBLIC_ENDPOINT_URL: ${{ vars.S3_PUBLIC_ENDPOINT_URL || 'https://lcslog.minidev.in' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://lcslog.minidev.in' }}
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          # Sensitive values are forwarded as environment variables, never
          # interpolated into the remote script.
          envs: DEPLOY_DIR,IMAGE_TAG,IMAGE_PREFIX,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET_KEY,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,S3_BUCKET,S3_REGION,S3_PUBLIC_ENDPOINT_URL,CORS_ORIGINS
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # Docker command (docker group, else sudo fallback).
            if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -E docker"; fi
            COMPOSE="$DOCKER compose -f compose.yml"

            # Fail fast if required production values are missing, before any
            # container or volume is touched.
            for name in POSTGRES_PASSWORD JWT_SECRET_KEY MINIO_ROOT_PASSWORD S3_PUBLIC_ENDPOINT_URL; do
              eval "value=\"\${$name:-}\""
              if [ -z "$value" ]; then
                echo "Missing required production value: $name" >&2
                exit 1
              fi
            done

            # Image names must be lowercase.
            IMAGE_PREFIX="$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"

            # Write the runtime .env atomically (0600). Values are passed as
            # printf arguments so their contents are never shell-expanded.
            ENV_FILE="$DEPLOY_DIR/.env"
            umask 077
            TMP="$(mktemp "$DEPLOY_DIR/.env.XXXXXX")"
            trap 'rm -f "$TMP"' EXIT
            write_kv() {
              key="$1"; value="$2"
              if [ "$(printf '%s' "$value" | wc -l | tr -d ' ')" != "0" ]; then
                echo "Value for $key contains a newline; refusing." >&2
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value"
            }
            {
              write_kv IMAGE_PREFIX "$IMAGE_PREFIX"
              write_kv IMAGE_TAG "$IMAGE_TAG"
              write_kv POSTGRES_DB "$POSTGRES_DB"
              write_kv POSTGRES_USER "$POSTGRES_USER"
              write_kv POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
              write_kv JWT_SECRET_KEY "$JWT_SECRET_KEY"
              write_kv MINIO_ROOT_USER "$MINIO_ROOT_USER"
              write_kv MINIO_ROOT_PASSWORD "$MINIO_ROOT_PASSWORD"
              write_kv S3_BUCKET "$S3_BUCKET"
              write_kv S3_REGION "$S3_REGION"
              write_kv S3_PUBLIC_ENDPOINT_URL "$S3_PUBLIC_ENDPOINT_URL"
              write_kv CORS_ORIGINS "$CORS_ORIGINS"
            } > "$TMP"
            chmod 600 "$TMP"
            mv -f "$TMP" "$ENV_FILE"
            trap - EXIT
            echo "Runtime .env written atomically (0600)."

            # Create and verify a PostgreSQL backup BEFORE any migration runs.
            # 'ff-db' is the postgres container name from deploy/compose.yml.
            if [ "$($DOCKER inspect -f '{{.State.Running}}' ff-db 2>/dev/null || echo false)" = "true" ]; then
              BACKUP_DIR="${HOME}/lcs-backups"
              mkdir -p "$BACKUP_DIR"
              BACKUP_FILE="$BACKUP_DIR/freight-$(date +%Y%m%d-%H%M%S).dump"
              echo "Backing up PostgreSQL to $BACKUP_FILE"
              # Credentials come from the container environment; nothing is echoed.
              if ! $COMPOSE exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"; then
                echo "PostgreSQL backup failed; aborting deployment." >&2
                rm -f "$BACKUP_FILE"
                exit 1
              fi
              if [ ! -s "$BACKUP_FILE" ]; then
                echo "PostgreSQL backup is empty; aborting deployment." >&2
                exit 1
              fi
              echo "Backup complete: $BACKUP_FILE"
            else
              echo "PostgreSQL is not running yet (first deployment); skipping backup."
            fi

            # Pull the exact immutable (public) images and recreate changed
            # services. No `down -v`; named volumes persist.
            export IMAGE_TAG
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            $DOCKER image prune -f

            # Bounded HTTPS readiness check (no fixed sleep, no HTTP fallback).
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 https://lcslog.minidev.in/health/ready; then
                echo "Deployment healthy (attempt $attempt)."
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30); retrying in 4s..."
              sleep 4
            done
            echo "Application did not become healthy within the retry window." >&2
            exit 1
