name: Production

# Production pipeline. Triggers only from `main` (push or manual dispatch).
# A push to `dev` can never reach this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing immutable image tag to deploy (rollback/redeploy). Leave empty to build from this commit.'
        required: false
        default: ''
      skip_migrations:
        description: 'Skip Alembic (only for rolling back/redeploying an image whose schema is already current)'
        type: boolean
        required: false
        default: false
      cleanup:
        description: 'Free host disk before deploying: dangling layers, build cache, old release images (running pair and rollback tags kept), trim local dumps to the newest 5'
        type: boolean
        required: false
        default: false
      diagnose:
        description: 'Only print runtime diagnostics from the host (no deploy, no changes)'
        type: boolean
        required: false
        default: false
      wipe_data:
        description: 'After a healthy deploy runs factory-reset: verified dump, then wipe DB/Redis/attachments; app returns to first-run /auth/setup. DESTRUCTIVE'
        type: boolean
        required: false
        default: false

# Least privilege by default; only the build job may publish images.
permissions:
  contents: read

# Only one production run at a time; never cancel an in-progress deployment.
concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Read-only host inspection for outages that are invisible from the deploy log
  # (nginx not listening, an exited container, a missing certificate volume).
  # Never starts, stops or rewrites anything.
  diagnose:
    name: Runtime diagnostics
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Dump host and container state
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          script: |
            set -uo pipefail
            cd /opt/lcs
            if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -E docker"; fi
            COMPOSE="$DOCKER compose -f docker-compose.prod.yml"
            echo "--- .env (image tag only) ---"
            sed -n 's/^IMAGE_TAG=/IMAGE_TAG=/p' .env || true
            echo "--- compose ps -a ---"
            $COMPOSE ps -a || true
            echo "--- container states ---"
            for name in ff-api ff-frontend ff-db ff-redis ff-minio; do
              $DOCKER inspect -f "$name status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$name" 2>&1 || true
            done
            echo "--- ff-frontend logs ---"
            $DOCKER logs --tail 100 ff-frontend 2>&1 || true
            echo "--- ff-api logs ---"
            $DOCKER logs --tail 40 ff-api 2>&1 || true
            echo "--- nginx config test ---"
            $COMPOSE run --rm --no-deps frontend nginx -t 2>&1 || true
            echo "--- certificate volume ---"
            $DOCKER run --rm -v freight_forwarding_certbot_etc:/etc/letsencrypt alpine sh -c 'ls -la /etc/letsencrypt/live 2>&1; ls -la /etc/letsencrypt/live/lcslog.minidev.in 2>&1' || true
            echo "--- host listeners ---"
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | head -20 || true
            echo "--- disk ---"
            df -h / || true

  # Host-space housekeeping before the deploy's pre-pull. With `cleanup: true`
  # it removes only what cannot serve the running stack: dangling image layers,
  # build cache, stale release images of this repository (the image pair the
  # running containers use is excluded by ID, so the rollback tags survive) and
  # it trims the local dump directory to the five newest dumps. It then refuses
  # to run the deployment when the root disk cannot hold a full pre-pull. It
  # never touches containers, volumes or the running application.
  free-disk:
    name: Host disk check
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # Pin the VPS SSH host key: the deploy never talks to an unverified host.
      - name: Verify VPS SSH host key
        env:
          HOST: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          PORT: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          FINGERPRINT: ${{ vars.AWS_HOST_FINGERPRINT }}
        run: |
          set -eu
          if [ -z "$FINGERPRINT" ]; then
            echo "Missing repo variable AWS_HOST_FINGERPRINT (ED25519 SHA256 fingerprint of the VPS host key)." >&2
            exit 1
          fi
          scan="$(mktemp)"
          ssh-keyscan -p "$PORT" "$HOST" > "$scan" 2>/dev/null
          if [ ! -s "$scan" ]; then
            echo "Could not reach the VPS SSH port ${PORT}." >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$scan" | grep "$FINGERPRINT" | grep -q "(ED25519)"; then
            echo "SSH host key fingerprint mismatch for ${HOST} — possible MITM or wrong host. Deploy aborted." >&2
            exit 1
          fi
          echo "SSH host key verified: $FINGERPRINT"

      - name: Housekeeping and space check
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          CLEANUP: ${{ inputs.cleanup }}
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          envs: IMAGE_PREFIX,CLEANUP
          script: |
            set -eu
            cd /opt/lcs
            if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -E docker"; fi
            IMAGE_PREFIX="$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
            if [ "$CLEANUP" = "true" ]; then
              echo "--- pruning dangling images and build cache ---"
              $DOCKER image prune -f || true
              $DOCKER builder prune -f || true
              echo "--- trimming local dumps to the newest 5 ---"
              BACKUP_DIR="${HOME}/lcs-backups"
              if [ -d "$BACKUP_DIR" ]; then
                ls -1t "$BACKUP_DIR"/freight-*.dump 2>/dev/null | tail -n +6 | xargs -r -n1 rm -f
                # Drop the checksum of any dump that is gone.
                for sum in "$BACKUP_DIR"/freight-*.dump.sha256; do
                  [ -e "$sum" ] || continue
                  [ -e "${sum%.sha256}" ] || rm -f "$sum"
                done
              fi
              echo "--- removing stale release images not used by the running stack ---"
              API_ID="$($DOCKER inspect -f '{{.Image}}' ff-api 2>/dev/null || true)"
              FE_ID="$($DOCKER inspect -f '{{.Image}}' ff-frontend 2>/dev/null || true)"
              for line in $($DOCKER images --format '{{.ID}} {{.Repository}}' \
                  | awk -v p="${IMAGE_PREFIX}-" 'index($2, p) == 1 { print }'); do
                id="${line%% *}"
                if [ "$id" != "$API_ID" ] && [ "$id" != "$FE_ID" ]; then
                  $DOCKER rmi -f "$id" >/dev/null 2>&1 || true
                fi
              done
            fi
            echo "--- disk ---"
            df -h /
            free_kb="$(df -P -k / | awk 'NR==2 {print $4}')"
            echo "Free space: ${free_kb} KB."
            if [ "${free_kb:-0}" -lt 1200000 ]; then
              echo "Not enough free space for a safe pre-pull (need about 1.2 GB)." >&2
              echo "Expand the EBS root volume (growpart + resize2fs) and re-run." >&2
              exit 1
            fi

  # Decide what to deploy: a fresh immutable sha tag, or a manually supplied
  # existing tag (rollback / redeploy without rebuilding).
  resolve:
    name: Resolve deployment tag
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "Manual deployment of existing image: $INPUT_TAG"
            echo "image_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # 1. Fast smoke of the core features only (auth/security, finance integrity,
  # cross-stack contract). The full backend suite runs on `dev` via dev-ci.yml
  # before anything can merge into `main`; production validation stays light so
  # deploys to the VPS stay fast.
  validate-backend:
    name: Backend smoke (core features)
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      # `test_route_authorization.py` is not yet committed to `main`; add it
      # back once that test lands. The full suite still gates dev merges.
      - run: >
          uv run pytest -q
          tests/test_frontend_api_contract.py
          tests/test_finance_automation.py
          tests/test_posting_rules.py

  validate-frontend:
    name: Frontend smoke (core features)
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run tests/freight-remote-endpoints.spec.ts tests/auth-api.spec.ts

  # 2-5. Build both images, tag with the immutable commit SHA and push to GHCR.
  # No environment: the frontend build only needs the repository-level
  # NUXT_PUBLIC_SITE_URL variable.
  build:
    name: Build ${{ matrix.name }} image
    needs: [resolve, validate-backend, validate-frontend]
    if: >-
      always() &&
      needs.resolve.outputs.build == 'true' &&
      needs.validate-backend.result == 'success' &&
      needs.validate-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
            NUXT_PUBLIC_CSRF_COOKIE_NAME=__Host-XSRF-TOKEN
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 6-13. Transfer ONLY the runtime files, pre-pull the new images, take and
  # verify a backup, run Alembic explicitly while the old app is still serving,
  # then recreate the stack and verify HTTPS readiness. Previous image IDs are
  # kept as local rollback tags; no destructive database restore is automatic.
  #
  # EC2 is a Docker runtime host: it does NOT hold the Git repository and never
  # runs git clone/pull/fetch/reset. The runtime directory is /opt/lcs.
  deploy:
    name: Deploy to AWS
    needs: [resolve, free-disk, validate-backend, validate-frontend, build]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.free-disk.result == 'success' &&
      (
        (needs.resolve.outputs.build == 'true' && needs.build.result == 'success') ||
        (needs.resolve.outputs.build == 'false' && needs.build.result == 'skipped')
      ) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    # Production secrets/variables are only needed here.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ensure the runtime directory exists and is writable by the deploy user.
      - name: Prepare runtime directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_DIR: /opt/lcs
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          envs: DEPLOY_DIR
          script: |
            set -eu
            if mkdir -p "$DEPLOY_DIR/nginx" 2>/dev/null; then
              echo "Runtime directory ready: $DEPLOY_DIR"
            elif sudo -n mkdir -p "$DEPLOY_DIR/nginx" 2>/dev/null; then
              sudo -n chown -R "$(id -u):$(id -g)" "$DEPLOY_DIR"
              echo "Runtime directory ready (via sudo): $DEPLOY_DIR"
            else
              echo "Cannot create $DEPLOY_DIR; create it and chown it to the deploy user." >&2
              exit 1
            fi

      # Copy only the runtime bundle: production compose + restore helper.
      - name: Upload runtime files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          source: "infrastructure/docker-compose.prod.yml,infrastructure/restore-db.sh,infrastructure/factory-reset.sh,infrastructure/bootstrap-host.sh"
          target: /opt/lcs
          strip_components: 1
          overwrite: true

      # The compose file mounts ./nginx/production.conf, so it must land inside
      # /opt/lcs/nginx/ (strip both path components).
      - name: Upload nginx config
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          source: "infrastructure/nginx/production.conf"
          target: /opt/lcs/nginx
          strip_components: 2
          overwrite: true

      # Generate the runtime .env atomically, pre-pull the new images, take and
      # verify a backup, run migrations with the new image while the old stack is
      # still serving, then recreate the stack. Previous image IDs are kept as
      # local rollback tags; no image is pruned before the new release passes.
      - name: Deploy ${{ needs.resolve.outputs.image_tag }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_DIR: /opt/lcs
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          SKIP_MIGRATIONS: ${{ github.event.inputs.skip_migrations || 'false' }}
          WIPE_DATA: ${{ github.event.inputs.wipe_data || 'false' }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || '' }}
          BACKUP_S3_KMS_KEY_ID: ${{ vars.BACKUP_S3_KMS_KEY_ID || '' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'freight' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'freight' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CSRF_SECRET_KEY: ${{ secrets.CSRF_SECRET_KEY }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER || 'minioadmin' }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_ACCESS_KEY: ${{ vars.S3_ACCESS_KEY || 'lcs-app' }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'freight-attachments' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_PUBLIC_ENDPOINT_URL: ${{ vars.S3_PUBLIC_ENDPOINT_URL || 'https://lcslog.minidev.in' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://lcslog.minidev.in' }}
        with:
          host: ${{ vars.AWS_HOST || secrets.AWS_HOST }}
          username: ${{ vars.AWS_USER || secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ vars.AWS_PORT || secrets.AWS_PORT || 22 }}
          # Sensitive values are forwarded as environment variables, never
          # interpolated into the remote script.
          envs: DEPLOY_DIR,IMAGE_TAG,IMAGE_PREFIX,SKIP_MIGRATIONS,WIPE_DATA,BACKUP_S3_BUCKET,BACKUP_S3_KMS_KEY_ID,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET_KEY,CSRF_SECRET_KEY,FIELD_ENCRYPTION_KEY,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET,S3_REGION,S3_PUBLIC_ENDPOINT_URL,CORS_ORIGINS
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            # scp may not preserve the executable bit; the restore helper is
            # invoked directly during a drill.
            chmod 700 "$DEPLOY_DIR/restore-db.sh" 2>/dev/null || true
            chmod 700 "$DEPLOY_DIR/factory-reset.sh" 2>/dev/null || true
            chmod 700 "$DEPLOY_DIR/bootstrap-host.sh" 2>/dev/null || true

            # Docker command (docker group, else sudo fallback).
            if docker info >/dev/null 2>&1; then DOCKER="docker"; else DOCKER="sudo -E docker"; fi
            COMPOSE="$DOCKER compose -f docker-compose.prod.yml"

            # Fail fast if required production values are missing, before any
            # container or volume is touched. Avoid eval with secret values.
            require_value() {
              if [ -z "$1" ]; then
                echo "Missing required production value: $2" >&2
                exit 1
              fi
            }
            require_value "${POSTGRES_PASSWORD:-}" POSTGRES_PASSWORD
            require_value "${JWT_SECRET_KEY:-}" JWT_SECRET_KEY
            require_value "${CSRF_SECRET_KEY:-}" CSRF_SECRET_KEY
            require_value "${FIELD_ENCRYPTION_KEY:-}" FIELD_ENCRYPTION_KEY
            require_value "${MINIO_ROOT_PASSWORD:-}" MINIO_ROOT_PASSWORD
            require_value "${S3_ACCESS_KEY:-}" S3_ACCESS_KEY
            require_value "${S3_SECRET_KEY:-}" S3_SECRET_KEY
            require_value "${S3_PUBLIC_ENDPOINT_URL:-}" S3_PUBLIC_ENDPOINT_URL

            # Image names must be lowercase.
            IMAGE_PREFIX="$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
            umask 077

            # Keep the previous .env so a failure before the stack is replaced
            # can put the host back exactly as it was.
            ENV_FILE="$DEPLOY_DIR/.env"
            PREVIOUS_ENV="$DEPLOY_DIR/.env.previous"
            if [ -f "$ENV_FILE" ]; then
              cp -p "$ENV_FILE" "$PREVIOUS_ENV"
              chmod 600 "$PREVIOUS_ENV"
              echo "Preserved previous runtime .env for failure recovery."
            else
              rm -f "$PREVIOUS_ENV"
            fi

            restore_previous_env() {
              if [ -f "$PREVIOUS_ENV" ]; then
                mv -f "$PREVIOUS_ENV" "$ENV_FILE"
                echo "Restored previous runtime .env; the running stack was not replaced."
              fi
            }

            # Write the runtime .env atomically (0600). Values are passed as
            # printf arguments so their contents are never shell-expanded.
            TMP="$(mktemp "$DEPLOY_DIR/.env.XXXXXX")"
            trap 'rm -f "$TMP"' EXIT
            write_kv() {
              key="$1"; value="$2"
              if [ "$(printf '%s' "$value" | wc -l | tr -d ' ')" != "0" ]; then
                echo "Value for $key contains a newline; refusing." >&2
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value"
            }
            {
              write_kv IMAGE_PREFIX "$IMAGE_PREFIX"
              write_kv IMAGE_TAG "$IMAGE_TAG"
              write_kv POSTGRES_DB "$POSTGRES_DB"
              write_kv POSTGRES_USER "$POSTGRES_USER"
              write_kv POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
              write_kv JWT_SECRET_KEY "$JWT_SECRET_KEY"
              write_kv CSRF_SECRET_KEY "$CSRF_SECRET_KEY"
              write_kv FIELD_ENCRYPTION_KEY "$FIELD_ENCRYPTION_KEY"
              write_kv MINIO_ROOT_USER "$MINIO_ROOT_USER"
              write_kv MINIO_ROOT_PASSWORD "$MINIO_ROOT_PASSWORD"
              write_kv S3_ACCESS_KEY "$S3_ACCESS_KEY"
              write_kv S3_SECRET_KEY "$S3_SECRET_KEY"
              write_kv S3_BUCKET "$S3_BUCKET"
              write_kv S3_REGION "$S3_REGION"
              write_kv S3_PUBLIC_ENDPOINT_URL "$S3_PUBLIC_ENDPOINT_URL"
              write_kv CORS_ORIGINS "$CORS_ORIGINS"
            } > "$TMP"
            chmod 600 "$TMP"
            mv -f "$TMP" "$ENV_FILE"
            trap - EXIT
            echo "Runtime .env written atomically (0600)."

            # Capture the exact image IDs the healthy stack is running. Tags in
            # a registry can be overwritten; these local tags cannot.
            PREVIOUS_BACKEND_IMAGE="$($DOCKER inspect -f '{{.Image}}' ff-api 2>/dev/null || true)"
            PREVIOUS_FRONTEND_IMAGE="$($DOCKER inspect -f '{{.Image}}' ff-frontend 2>/dev/null || true)"
            ROLLBACK_TAG="rollback-$(date -u +%Y%m%dT%H%M%SZ)"
            ROLLBACK_READY=false
            if [ -n "$PREVIOUS_BACKEND_IMAGE" ] && [ -n "$PREVIOUS_FRONTEND_IMAGE" ]; then
              if ! $DOCKER tag "$PREVIOUS_BACKEND_IMAGE" "rollback-backend:$ROLLBACK_TAG" \
                 || ! $DOCKER tag "$PREVIOUS_FRONTEND_IMAGE" "rollback-frontend:$ROLLBACK_TAG"; then
                echo "Could not tag the previous images for rollback; old stack left running." >&2
                restore_previous_env
                exit 1
              fi
              ROLLBACK_READY=true
              echo "Previous images preserved as rollback-backend:$ROLLBACK_TAG and rollback-frontend:$ROLLBACK_TAG"
            else
              echo "No running previous backend/frontend images found; first deployment or incomplete stack."
            fi

            # Pull both new images before stopping or recreating anything. A
            # registry, network or disk failure here leaves the healthy stack up.
            echo "Pre-pulling new images..."
            if ! $DOCKER pull "$IMAGE_PREFIX-backend:$IMAGE_TAG"; then
              echo "Backend image pre-pull failed; old stack left running." >&2
              restore_previous_env
              exit 1
            fi
            if ! $DOCKER pull "$IMAGE_PREFIX-frontend:$IMAGE_TAG"; then
              echo "Frontend image pre-pull failed; old stack left running." >&2
              restore_previous_env
              exit 1
            fi
            if ! $DOCKER image inspect "$IMAGE_PREFIX-backend:$IMAGE_TAG" >/dev/null 2>&1 \
               || ! $DOCKER image inspect "$IMAGE_PREFIX-frontend:$IMAGE_TAG" >/dev/null 2>&1; then
              echo "Pre-pulled images are missing locally; old stack left running." >&2
              restore_previous_env
              exit 1
            fi

            # Ensure PostgreSQL is running for backup/migration. On an existing
            # host this is already true; on first deployment it starts only the
            # data services, not the application.
            if [ "$($DOCKER inspect -f '{{.State.Running}}' ff-db 2>/dev/null || echo false)" != "true" ]; then
              echo "PostgreSQL is not running; starting data services for backup/migration..."
              if ! $COMPOSE up -d postgres redis minio; then
                echo "Could not start data services; aborting before migration." >&2
                restore_previous_env
                exit 1
              fi
            fi
            DB_HEALTH=""
            for attempt in $(seq 1 30); do
              DB_HEALTH="$($DOCKER inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ff-db 2>/dev/null || echo unknown)"
              [ "$DB_HEALTH" = "healthy" ] && break
              sleep 2
            done
            if [ "$DB_HEALTH" != "healthy" ]; then
              echo "PostgreSQL did not become healthy (state=$DB_HEALTH); aborting before migration." >&2
              restore_previous_env
              exit 1
            fi

            # Create and verify a PostgreSQL backup BEFORE any migration runs.
            # 'ff-db' is the postgres container name from the production compose.
            BACKUP_DIR="${HOME}/lcs-backups"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/freight-$(date +%Y%m%d-%H%M%S).dump"
            echo "Backing up PostgreSQL to $BACKUP_FILE"
            # Credentials come from the container environment; nothing is echoed.
            if ! $COMPOSE exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"; then
              echo "PostgreSQL backup failed; aborting deployment." >&2
              rm -f "$BACKUP_FILE"
              restore_previous_env
              exit 1
            fi
            if [ ! -s "$BACKUP_FILE" ]; then
              echo "PostgreSQL backup is empty; aborting deployment." >&2
              restore_previous_env
              exit 1
            fi
            if ! $COMPOSE exec -T postgres pg_restore --list < "$BACKUP_FILE" >/dev/null; then
              echo "PostgreSQL backup failed pg_restore --list verification; aborting." >&2
              restore_previous_env
              exit 1
            fi
            sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"
            echo "Backup complete and verified: $BACKUP_FILE"

            # Optional encrypted off-host copy. If the bucket is configured, a
            # missing AWS CLI or failed upload aborts the deployment rather than
            # pretending the run has an off-host backup.
            if [ -n "${BACKUP_S3_BUCKET:-}" ]; then
              if ! command -v aws >/dev/null 2>&1; then
                echo "BACKUP_S3_BUCKET is configured but the aws CLI is not installed; aborting." >&2
                restore_previous_env
                exit 1
              fi
              S3_PREFIX="s3://$BACKUP_S3_BUCKET/lcs/postgres/$(basename "$BACKUP_FILE")"
              echo "Uploading encrypted off-host backup to $S3_PREFIX"
              if [ -n "${BACKUP_S3_KMS_KEY_ID:-}" ]; then
                if ! aws s3 cp "$BACKUP_FILE" "$S3_PREFIX" --sse aws:kms --sse-kms-key-id "$BACKUP_S3_KMS_KEY_ID" \
                   || ! aws s3 cp "$BACKUP_FILE.sha256" "$S3_PREFIX.sha256" --sse aws:kms --sse-kms-key-id "$BACKUP_S3_KMS_KEY_ID"; then
                  echo "Off-host backup upload failed; aborting deployment." >&2
                  restore_previous_env
                  exit 1
                fi
              else
                if ! aws s3 cp "$BACKUP_FILE" "$S3_PREFIX" --sse aws:kms \
                   || ! aws s3 cp "$BACKUP_FILE.sha256" "$S3_PREFIX.sha256" --sse aws:kms; then
                  echo "Off-host backup upload failed; aborting deployment." >&2
                  restore_previous_env
                  exit 1
                fi
              fi
            fi

            find "$BACKUP_DIR" -maxdepth 1 -type f \
              \( -name 'freight-*.dump' -o -name 'freight-*.dump.sha256' \) \
              -mtime +30 -delete || true

            # Run migrations explicitly with the new backend image while the
            # old application is still serving. Current migrations are additive,
            # so the old image remains schema-compatible if rollback is needed.
            if [ "${SKIP_MIGRATIONS:-false}" = "true" ]; then
              echo "SKIP_MIGRATIONS=true: not running Alembic (manual rollback/redeploy)."
            else
              echo "Running Alembic upgrade head with $IMAGE_PREFIX-backend:$IMAGE_TAG"
              if ! IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
                   $COMPOSE run -T --rm --no-deps backend alembic upgrade head; then
                echo "Migration failed; old application stack left running." >&2
                restore_previous_env
                exit 1
              fi
              EXPECTED_HEAD="$(IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
                $COMPOSE run -T --rm --no-deps backend alembic heads 2>/dev/null \
                | awk 'NF && $1 !~ /^INFO/ {print $1; exit}' || true)"
              CURRENT_HEAD="$(IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
                $COMPOSE run -T --rm --no-deps backend alembic current 2>/dev/null \
                | awk 'NF && $1 !~ /^INFO/ {print $1; exit}' || true)"
              if [ -z "$EXPECTED_HEAD" ] || [ "$CURRENT_HEAD" != "$EXPECTED_HEAD" ]; then
                echo "Migration verification failed: expected=${EXPECTED_HEAD:-unknown} current=${CURRENT_HEAD:-unknown}" >&2
                restore_previous_env
                exit 1
              fi
              echo "Migration verified at $CURRENT_HEAD."
            fi

            # The new images are local, the database is migrated, and the old
            # stack is still running. Recreate only changed services.
            export IMAGE_PREFIX IMAGE_TAG
            UP_OK=false
            if $COMPOSE up -d --remove-orphans; then
              UP_OK=true
            else
              echo "Compose up failed; readiness/rollback handling follows." >&2
            fi

            # Bounded HTTPS readiness check (no fixed sleep, no HTTP fallback):
            # backend readiness AND the SPA itself must answer through nginx.
            READY=false
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 https://lcslog.minidev.in/health/ready \
                 && curl -fsS --max-time 5 -o /dev/null https://lcslog.minidev.in/; then
                READY=true
                echo "Deployment healthy (attempt $attempt)."
                break
              fi
              echo "Not ready yet (attempt $attempt/30); retrying in 4s..."
              sleep 4
            done

            if [ "$UP_OK" != "true" ] || [ "$READY" != "true" ]; then
              echo "Deployment did not complete cleanly (compose_up=$UP_OK readiness=$READY)." >&2
              echo "--- compose ps -a ---"
              $COMPOSE ps -a || true
              echo "--- ff-frontend logs ---"
              $DOCKER logs --tail 100 ff-frontend 2>&1 || true
              echo "--- ff-api logs ---"
              $DOCKER logs --tail 40 ff-api 2>&1 || true
              echo "--- nginx config test ---"
              $COMPOSE run -T --rm --no-deps frontend nginx -t 2>&1 || true
              echo "--- certificate volume ---"
              $DOCKER run --rm -v freight_forwarding_certbot_etc:/etc/letsencrypt alpine sh -c 'ls -la /etc/letsencrypt/live 2>&1; ls -la /etc/letsencrypt/live/lcslog.minidev.in 2>&1' || true
              echo "--- disk ---"
              df -h / || true

              if [ "$ROLLBACK_READY" = "true" ]; then
                echo "Rolling application images back to rollback-backend:$ROLLBACK_TAG and rollback-frontend:$ROLLBACK_TAG" >&2
                sed -i "s|^IMAGE_PREFIX=.*|IMAGE_PREFIX=rollback|; s|^IMAGE_TAG=.*|IMAGE_TAG=$ROLLBACK_TAG|" "$ENV_FILE"
                chmod 600 "$ENV_FILE"
                export IMAGE_PREFIX=rollback IMAGE_TAG="$ROLLBACK_TAG"
                if $COMPOSE up -d --remove-orphans; then
                  for attempt in $(seq 1 30); do
                    if curl -fsS --max-time 5 https://lcslog.minidev.in/health/ready \
                       && curl -fsS --max-time 5 -o /dev/null https://lcslog.minidev.in/; then
                      echo "Rollback healthy (attempt $attempt); deployment failed." >&2
                      rm -f "$PREVIOUS_ENV"
                      exit 1
                    fi
                    echo "Rollback not ready yet (attempt $attempt/30); retrying in 4s..."
                    sleep 4
                  done
                fi
                echo "Rollback did not become healthy. Manual recovery is required." >&2
              else
                echo "No previous image IDs are available; manual recovery is required." >&2
              fi
              echo "Do not automatically restore the database: writes may have occurred since $BACKUP_FILE." >&2
              exit 1
            fi

            rm -f "$PREVIOUS_ENV"
            # Remove only dangling layers and older rollback tags; the release we
            # just replaced stays available for a manual rollback.
            $DOCKER image prune -f || true
            $DOCKER image ls --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '^rollback-(backend|frontend):' \
              | grep -v ":$ROLLBACK_TAG" \
              | xargs -r -n1 $DOCKER rmi >/dev/null 2>&1 || true
            echo "Deployment complete. Previous release remains available as rollback-*:${ROLLBACK_TAG}."

            if [ "${WIPE_DATA:-false}" = "true" ]; then
              echo "WIPE_DATA=true: running the guarded factory reset on the verified stack."
              echo "This takes a fresh dump, drops the schema, re-migrates and empties Redis/attachments."
              if ! "$DEPLOY_DIR/factory-reset.sh" --yes; then
                echo "Factory reset FAILED; the stack is up on the new code but data state is unclear." >&2
                echo "Do not trust the attached data. Inspect: docker compose logs backend" >&2
                exit 1
              fi
              echo "Wipe complete: requiresSetup=true, a first-run administrator must be created at /auth/setup."
            fi
