name: Production

# Production pipeline. Triggers only from `main` (push or manual dispatch).
# A push to `dev` can never reach this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing immutable image tag to deploy (e.g. sha-c1ccaf8). Leave empty to build from this commit.'
        required: false
        default: ''

# Least privilege by default; only the build job may publish images.
permissions:
  contents: read

# Only one production run at a time; never cancel an in-progress deployment.
concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Decide what to deploy: a fresh immutable sha tag, or a manually supplied
  # existing tag (rollback / redeploy without rebuilding).
  resolve:
    name: Resolve deployment tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "Manual deployment of existing image: $INPUT_TAG"
            echo "image_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # 1. Production validation/tests.
  validate-backend:
    name: Production backend validation
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  validate-frontend:
    name: Production frontend validation
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # 2-5. Build both images, tag with the immutable commit SHA and push to GHCR.
  build:
    name: Build ${{ matrix.name }} image
    needs: [resolve, validate-backend, validate-frontend]
    if: >-
      always() &&
      needs.resolve.outputs.build == 'true' &&
      needs.validate-backend.result == 'success' &&
      needs.validate-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://lcslog.minidev.in' }}
            NUXT_PUBLIC_AUTH_MODE=cookie
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 6-11. Back up the database, deploy the exact SHA-tagged images, recreate the
  # stack (Alembic runs on backend start) and verify HTTPS readiness.
  deploy:
    name: Deploy to AWS
    needs: [resolve, validate-backend, validate-frontend, build]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (
        (needs.resolve.outputs.build == 'true' && needs.build.result == 'success') ||
        (needs.resolve.outputs.build == 'false' && needs.build.result == 'skipped')
      ) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy ${{ needs.resolve.outputs.image_tag }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          # Sensitive values are forwarded as environment variables, never
          # interpolated into the remote script.
          envs: IMAGE_TAG,GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -euo pipefail

            # Deterministic sync of the deployment-only checkout.
            # infrastructure/.env is git-ignored; certificates, uploads and the
            # database live in Docker named volumes; backups live in
            # $HOME/lcs-backups. A hard reset cannot delete persistent state.
            cd /opt/freight-forwarding
            git fetch --prune origin main
            git reset --hard origin/main
            cd infrastructure

            # Choose the docker command (docker group, else sudo fallback).
            if docker info >/dev/null 2>&1; then
              DOCKER="docker"
            else
              DOCKER="sudo -E docker"
            fi
            COMPOSE="$DOCKER compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Authenticate to GHCR (token supplied via the action env).
            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "GHCR_TOKEN is not set." >&2
              exit 1
            fi
            echo "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Create and verify a PostgreSQL backup BEFORE any migration runs.
            # 'ff-db' is the postgres container name from docker-compose.yml.
            if [ "$($DOCKER inspect -f '{{.State.Running}}' ff-db 2>/dev/null || echo false)" = "true" ]; then
              BACKUP_DIR="${HOME}/lcs-backups"
              mkdir -p "$BACKUP_DIR"
              BACKUP_FILE="$BACKUP_DIR/freight-$(date +%Y%m%d-%H%M%S).dump"
              echo "Backing up PostgreSQL to $BACKUP_FILE"
              # Credentials come from the container environment; nothing is echoed.
              if ! $COMPOSE exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"; then
                echo "::error::PostgreSQL backup failed; aborting deployment."
                rm -f "$BACKUP_FILE"
                exit 1
              fi
              if [ ! -s "$BACKUP_FILE" ]; then
                echo "::error::PostgreSQL backup is empty; aborting deployment."
                exit 1
              fi
              echo "Backup complete: $BACKUP_FILE"
            else
              echo "PostgreSQL is not running yet (first deployment); skipping backup."
            fi

            # Pull the exact immutable images and recreate changed services.
            # No `down -v`; volumes (database, uploads, certificates) are preserved.
            export IMAGE_TAG
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            $DOCKER image prune -f

            # Bounded HTTPS readiness check (no fixed sleep, no HTTP fallback).
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 https://lcslog.minidev.in/health/ready; then
                echo "Deployment healthy (attempt $attempt)."
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30); retrying in 4s..."
              sleep 4
            done
            echo "::error::Application did not become healthy within the retry window."
            exit 1
