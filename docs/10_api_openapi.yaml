openapi: 3.0.3
info:
  title: Freight Forwarding and Finance Platform API
  version: 2.0.0
  description: >-
    Organization- and branch-scoped API for freight operations, informational
    service charges, reusable financial documents, and double-entry accounting.
servers:
  - url: /api/v1
    description: Current API
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Organizations
  - name: Users and Authorization
  - name: Master Data
  - name: Configuration
  - name: Quotations
  - name: Service Orders
  - name: Service Charges
  - name: Finance
  - name: Accounting
  - name: Attachments
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Too many attempts}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': {description: Session revoked}
  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200': {description: Token refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      responses: {'200': {description: Organizations, content: {application/json: {schema: {$ref: '#/components/schemas/PagedOrganizationResponse'}}}}}
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationCreate'}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}}
  /organizations/{organizationId}/branches:
    get:
      tags: [Organizations]
      operationId: listBranches
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses: {'200': {description: Branches, content: {application/json: {schema: {$ref: '#/components/schemas/PagedBranchResponse'}}}}}
    post:
      tags: [Organizations]
      operationId: createBranch
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BranchCreate'}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Branch'}}}}}
  /users:
    get:
      tags: [Users and Authorization]
      operationId: listUsers
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/PagedUserResponse'}}}}}
    post:
      tags: [Users and Authorization]
      operationId: inviteUser
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}
      responses: {'201': {description: User invited, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}}
  /users/{userId}/role-assignments:
    post:
      tags: [Users and Authorization]
      operationId: assignRole
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoleAssignmentCreate'}}}
      responses: {'201': {description: Role assigned}}
  /quotations:
    get:
      tags: [Quotations]
      operationId: listQuotations
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/BranchFilter'}, {name: status, in: query, schema: {type: string}}, {name: customer_party_id, in: query, schema: {type: integer}}]
      responses: {'200': {description: Quotations, content: {application/json: {schema: {$ref: '#/components/schemas/PagedQuotationResponse'}}}}}
    post:
      tags: [Quotations]
      operationId: createQuotation
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuotationCreate'}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}}}
  /quotations/{quotationId}/revisions:
    post:
      tags: [Quotations]
      operationId: createQuotationRevision
      parameters: [{$ref: '#/components/parameters/QuotationId'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/RevisionCreate'}}}
      responses: {'201': {description: Revision created}}
  /quotation-revisions/{revisionId}/send:
    post:
      tags: [Quotations]
      operationId: sendQuotationRevision
      parameters: [{$ref: '#/components/parameters/RevisionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Revision sent}}
  /quotation-revisions/{revisionId}/accept:
    post:
      tags: [Quotations]
      operationId: acceptQuotationRevision
      parameters: [{$ref: '#/components/parameters/RevisionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Revision accepted}}
  /quotation-revisions/{revisionId}/convert:
    post:
      tags: [Quotations]
      operationId: convertQuotationRevision
      parameters: [{$ref: '#/components/parameters/RevisionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {description: Service order created}}
  /service-orders:
    get:
      tags: [Service Orders]
      operationId: listServiceOrders
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/BranchFilter'}, {name: status, in: query, schema: {type: string}}, {name: customer_party_id, in: query, schema: {type: integer}}]
      responses: {'200': {description: Service orders, content: {application/json: {schema: {$ref: '#/components/schemas/PagedServiceOrderResponse'}}}}}
  /service-orders/{serviceOrderId}:
    get:
      tags: [Service Orders]
      operationId: getServiceOrder
      parameters: [{$ref: '#/components/parameters/ServiceOrderId'}]
      responses: {'200': {description: Service order, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrder'}}}}}
  /service-orders/{serviceOrderId}/containers:
    post:
      tags: [Service Orders]
      operationId: addActualContainer
      parameters: [{$ref: '#/components/parameters/ServiceOrderId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActualContainerCreate'}}}
      responses: {'201': {description: Container created}}
  /service-orders/{serviceOrderId}/components:
    post:
      tags: [Service Orders]
      operationId: addServiceComponent
      parameters: [{$ref: '#/components/parameters/ServiceOrderId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ComponentCreate'}}}
      responses: {'201': {description: Component created}}
  /service-order-components/{componentId}/values:
    put:
      tags: [Service Orders]
      operationId: replaceComponentValues
      parameters: [{$ref: '#/components/parameters/ComponentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ComponentValuesReplace'}}}
      responses: {'200': {description: Values saved}}
  /service-order-components/{componentId}/complete:
    post:
      tags: [Service Orders]
      operationId: completeComponent
      parameters: [{$ref: '#/components/parameters/ComponentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Component completed}}
  /service-orders/{serviceOrderId}/charges:
    get:
      tags: [Service Charges]
      operationId: listServiceCharges
      parameters: [{$ref: '#/components/parameters/ServiceOrderId'}]
      responses: {'200': {description: Charges}}
    post:
      tags: [Service Charges]
      operationId: createServiceCharge
      parameters: [{$ref: '#/components/parameters/ServiceOrderId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ServiceChargeCreate'}}}
      responses: {'201': {description: Charge created}}
  /service-charges/{chargeId}/issue:
    post:
      tags: [Service Charges]
      operationId: issueServiceCharge
      parameters: [{$ref: '#/components/parameters/ChargeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Charge issued; no accounting journal is created}}
  /service-charges/{chargeId}/create-finance-invoice:
    post:
      tags: [Service Charges]
      operationId: createFinanceInvoiceFromCharge
      parameters: [{$ref: '#/components/parameters/ChargeId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {description: Draft financial invoice created}}
  /financial-documents:
    get:
      tags: [Finance]
      operationId: listFinancialDocuments
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/BranchFilter'}, {name: document_type, in: query, schema: {type: string}}, {name: status, in: query, schema: {type: string}}, {name: party_id, in: query, schema: {type: integer}}]
      responses: {'200': {description: Financial documents, content: {application/json: {schema: {$ref: '#/components/schemas/PagedFinancialDocumentResponse'}}}}}
    post:
      tags: [Finance]
      operationId: createFinancialDocument
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FinancialDocumentCreate'}}}
      responses: {'201': {description: Draft document created}}
  /financial-documents/{documentId}/post:
    post:
      tags: [Finance]
      operationId: postFinancialDocument
      parameters: [{$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Posted and journal generated}
        '409': {description: Period closed, already posted, or duplicate command}
  /financial-documents/{documentId}/allocate:
    post:
      tags: [Finance]
      operationId: allocatePayment
      parameters: [{$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AllocationCreate'}}}
      responses: {'201': {description: Allocation created}}
  /financial-documents/{documentId}/reverse:
    post:
      tags: [Finance]
      operationId: reverseFinancialDocument
      parameters: [{$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReversalRequest'}}}
      responses: {'201': {description: Reversal created}}
  /journal-entries:
    get:
      tags: [Accounting]
      operationId: listJournalEntries
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/BranchFilter'}, {name: status, in: query, schema: {type: string}}]
      responses: {'200': {description: Journal entries}}
    post:
      tags: [Accounting]
      operationId: createManualJournal
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JournalEntryCreate'}}}
      responses: {'201': {description: Draft journal created}}
  /journal-entries/{journalId}/post:
    post:
      tags: [Accounting]
      operationId: postManualJournal
      parameters: [{$ref: '#/components/parameters/JournalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Balanced journal posted}}
  /accounting-periods/{periodId}/close:
    post:
      tags: [Accounting]
      operationId: closeAccountingPeriod
      parameters: [{$ref: '#/components/parameters/PeriodId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}
      responses: {'200': {description: Period closed}}
  /attachments/presign:
    post:
      tags: [Attachments]
      operationId: presignAttachment
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentPresignRequest'}}}
      responses: {'200': {description: Presigned upload returned}}
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/BranchFilter'}, {name: entity_type, in: query, schema: {type: string}}, {name: entity_id, in: query, schema: {type: integer}}, {name: event_type, in: query, schema: {type: string}}]
      responses: {'200': {description: Audit events}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    OrganizationId: {name: organizationId, in: path, required: true, schema: {type: integer, format: int64}}
    UserId: {name: userId, in: path, required: true, schema: {type: integer, format: int64}}
    RevisionId: {name: revisionId, in: path, required: true, schema: {type: integer, format: int64}}
    ServiceOrderId: {name: serviceOrderId, in: path, required: true, schema: {type: integer, format: int64}}
    ComponentId: {name: componentId, in: path, required: true, schema: {type: integer, format: int64}}
    ChargeId: {name: chargeId, in: path, required: true, schema: {type: integer, format: int64}}
    DocumentId: {name: documentId, in: path, required: true, schema: {type: integer, format: int64}}
    JournalId: {name: journalId, in: path, required: true, schema: {type: integer, format: int64}}
    PeriodId: {name: periodId, in: path, required: true, schema: {type: integer, format: int64}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    BranchFilter: {name: branch_id, in: query, schema: {type: integer, format: int64}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Permission or branch scope denied}
    ValidationError: {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        field_errors: {type: object, additionalProperties: {type: string}}
    PageMeta:
      type: object
      properties: {page: {type: integer}, page_size: {type: integer}, total: {type: integer}}
    LoginRequest:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    AuthResponse:
      type: object
      properties: {access_token: {type: string}, refresh_token: {type: string}, token_type: {type: string, example: Bearer}, expires_in: {type: integer}}
    OrganizationCreate:
      type: object
      required: [organization_code, legal_name, default_currency_code]
      properties: {organization_code: {type: string}, legal_name: {type: string}, display_name: {type: string}, default_currency_code: {type: string, minLength: 3, maxLength: 3}, timezone: {type: string}}
    Organization:
      allOf: [{ $ref: '#/components/schemas/OrganizationCreate' }, {type: object, properties: {id: {type: integer}, status: {type: string}}}]
    BranchCreate:
      type: object
      required: [branch_code, name]
      properties: {branch_code: {type: string}, name: {type: string}, place_id: {type: integer}, address: {type: string}, is_head_office: {type: boolean}}
    Branch:
      allOf: [{ $ref: '#/components/schemas/BranchCreate' }, {type: object, properties: {id: {type: integer}, organization_id: {type: integer}}}]
    UserCreate:
      type: object
      required: [user_code, username, email, display_name]
      properties: {user_code: {type: string}, username: {type: string}, email: {type: string, format: email}, display_name: {type: string}}
    User:
      allOf: [{ $ref: '#/components/schemas/UserCreate' }, {type: object, properties: {id: {type: integer}, status: {type: string}}}]
    RoleAssignmentCreate:
      type: object
      required: [role_id, organization_id]
      properties: {role_id: {type: integer}, organization_id: {type: integer}, branch_id: {type: integer, nullable: true}, starts_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time, nullable: true}}
    QuotationCreate:
      type: object
      required: [branch_id, customer_party_id, trade_direction_id, currency_code, revision]
      properties: {branch_id: {type: integer}, customer_party_id: {type: integer}, trade_direction_id: {type: integer}, currency_code: {type: string, minLength: 3, maxLength: 3}, revision: {$ref: '#/components/schemas/RevisionCreate'}}
    RevisionCreate:
      type: object
      required: [quotation_date, currency_code]
      properties: {quotation_date: {type: string, format: date}, valid_until: {type: string, format: date}, currency_code: {type: string, minLength: 3, maxLength: 3}, description: {type: string}, notes: {type: string}, places: {type: array, items: {type: object}}, containers: {type: array, items: {type: object}}, lines: {type: array, items: {type: object}}}
    ActualContainerCreate:
      type: object
      required: [container_type_id, container_number]
      properties: {container_requirement_id: {type: integer}, container_type_id: {type: integer}, container_number: {type: string}, seal_serial: {type: string}, net_weight_kg: {type: number}, gross_weight_kg: {type: number}}
    ComponentCreate:
      type: object
      required: [trade_direction_component_id]
      properties: {trade_direction_component_id: {type: integer}, sequence_no: {type: integer, minimum: 1}}
    ComponentValuesReplace:
      type: object
      required: [values]
      properties: {values: {type: array, items: {type: object, required: [template_attribute_id], properties: {template_attribute_id: {type: integer}, value_text: {type: string}, value_number: {type: number}, value_date: {type: string, format: date}, value_datetime: {type: string, format: date-time}, value_boolean: {type: boolean}, value_reference_type: {type: string}, value_reference_id: {type: integer}, value_json: {type: object}}}}}
    ServiceChargeCreate:
      type: object
      required: [document_type, document_date, currency_code, lines]
      properties: {document_type: {type: string}, document_date: {type: string, format: date}, currency_code: {type: string, minLength: 3, maxLength: 3}, remark: {type: string}, lines: {type: array, minItems: 1, items: {type: object, required: [description, quantity, unit_price], properties: {fee_type_id: {type: integer}, service_order_container_id: {type: integer}, description: {type: string}, quantity: {type: number}, unit_price: {type: number}, discount_amount: {type: number}, tax_rate: {type: number}}}}}
    FinancialDocumentCreate:
      type: object
      required: [document_type, document_date, currency_code, lines]
      properties: {document_type: {type: string}, document_date: {type: string, format: date}, party_id: {type: integer}, service_order_id: {type: integer}, branch_id: {type: integer}, currency_code: {type: string, minLength: 3, maxLength: 3}, description: {type: string}, reference_number: {type: string}, due_date: {type: string, format: date}, payment_method_code: {type: string}, financial_account_id: {type: integer}, lines: {type: array, minItems: 1, items: {type: object, required: [description, line_amount], properties: {description: {type: string}, fee_type_id: {type: integer}, service_order_id: {type: integer}, service_order_container_id: {type: integer}, account_id: {type: integer}, quantity: {type: number}, unit_price: {type: number}, line_amount: {type: number}}}}}
    AllocationCreate:
      type: object
      required: [target_document_id, allocated_amount, allocated_currency_code]
      properties: {target_document_id: {type: integer}, allocated_amount: {type: number, exclusiveMinimum: 0}, allocated_currency_code: {type: string, minLength: 3, maxLength: 3}, exchange_rate: {type: number, exclusiveMinimum: 0}}
    ReversalRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 1}}
    JournalEntryCreate:
      type: object
      required: [entry_type, entry_date, posting_date, accounting_period_id, lines]
      properties: {entry_type: {type: string}, entry_date: {type: string, format: date}, posting_date: {type: string, format: date}, accounting_period_id: {type: integer}, description: {type: string}, branch_id: {type: integer}, lines: {type: array, minItems: 2, items: {type: object, required: [account_id, currency_code], properties: {account_id: {type: integer}, branch_id: {type: integer}, debit_amount: {type: number}, credit_amount: {type: number}, currency_code: {type: string, minLength: 3, maxLength: 3}, description: {type: string}}}}}
    ReasonRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string}}
    AttachmentPresignRequest:
      type: object
      required: [file_name, mime_type, file_size_bytes, entity_type, entity_id]
      properties: {file_name: {type: string}, mime_type: {type: string}, file_size_bytes: {type: integer}, entity_type: {type: string}, entity_id: {type: integer}, attachment_role: {type: string}}
    PagedOrganizationResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Organization'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    PagedBranchResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Branch'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    PagedUserResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    Quotation: {type: object, properties: {id: {type: integer}, quotation_no: {type: string}, organization_id: {type: integer}, branch_id: {type: integer}, status: {type: string}}}
    PagedQuotationResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Quotation'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    ServiceOrder: {type: object, properties: {id: {type: integer}, service_order_no: {type: string}, organization_id: {type: integer}, branch_id: {type: integer}, status: {type: string}}}
    PagedServiceOrderResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ServiceOrder'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    FinancialDocument: {type: object, properties: {id: {type: integer}, document_no: {type: string}, document_type: {type: string}, status: {type: string}, total_amount: {type: number}}}
    PagedFinancialDocumentResponse: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/FinancialDocument'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
