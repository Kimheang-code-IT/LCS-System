# Casbin RBAC model for the LCS platform.
#
#   p, role:SALES, quotation, read      a role holds an action on an object
#   p, user:15,  report, read           an optional direct user grant
#   p, role:SUPER_ADMIN, *, *           the protected super administrator
#   g, user:15, role:SALES              role assignment (one role per user)
#
# Objects and actions are the two halves of a permission code split at the last
# dot: ``quotation.update_draft`` -> (quotation, update_draft),
# ``sales.quotations.view`` -> (sales.quotations, view).
#
# Default deny: the effect is ``some(where (p.eft == allow))`` and the matcher
# requires an explicit policy for the subject, so an unknown user, an unknown
# role, a disabled role (its ``g`` rows are removed) or a code nobody granted
# all evaluate to false.
#
# No wildcard *objects* are matched implicitly: ``p.obj == "*"`` is an explicit
# policy row, never a pattern, so a broad grant can never leak into an unrelated
# capability by accident.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
