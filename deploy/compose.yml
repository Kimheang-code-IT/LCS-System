# Standalone production stack for the EC2 runtime host.
#
# This file is the ONLY compose file deployed to EC2 (as /opt/lcs/compose.yml)
# by .github/workflows/production.yml. Nothing is built on the host: images come
# prebuilt from GHCR and are pinned by the immutable sha-<short> tag in .env.
#
# Networking: only the frontend (nginx) publishes host ports (80/443). Postgres,
# Redis, MinIO and the backend are reachable only on the internal Docker network
# via their service names. No datastore or backend port is published.
#
# Persistence: every stateful service uses a named volume. Never run
# `docker compose down -v` — it would delete the database, uploads, objects and
# TLS certificates.
name: freight_forwarding

services:
  postgres:
    container_name: ff-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - freight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    container_name: ff-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - freight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    container_name: ff-minio
    # Upstream MinIO removed its Docker Hub/Quay images (source-only since Oct
    # 2025). pgsty/minio is a maintained, drop-in community fork: same env vars,
    # `server` command, /data layout and `mc` healthcheck binary.
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - freight_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: ff-api
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Internal wiring is fixed here; secrets/values come from /opt/lcs/.env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: "true"
      STORAGE_PROVIDER: s3
      STORAGE_LOCAL_PATH: /app/storage
      S3_ENDPOINT_URL: http://minio:9000
      # Browser-facing endpoint used to sign upload/download URLs. Must be the
      # public MinIO host served by nginx (see storage.lcslog.minidev.in block).
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      # S3 credentials reuse the MinIO root credentials by design.
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "false"
    expose:
      - "8000"
    volumes:
      - freight_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    container_name: ff-frontend
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    # The only service that publishes host ports.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS + SPA + API proxy + storage proxy (deployed by the workflow).
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared with certbot: read-only certificate store + ACME webroot.
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  # One-shot helper (profile "tools"): certificate issuance/renewal only.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  freight_postgres_data:
  freight_redis_data:
  freight_minio_data:
  freight_uploads:
  certbot_etc:
  certbot_www:
