# Standalone production stack for the EC2 runtime host.
#
# This file is the ONLY compose file deployed to the production host (as
# /opt/lcs/docker-compose.prod.yml) by .github/workflows/production.yml. Nothing is built on the host: images come
# prebuilt from GHCR and are pinned by the immutable sha-<short> tag in .env.
# The workflow pre-pulls the new images, runs Alembic explicitly with the new
# backend image while the old stack still serves, and only then recreates the
# stack. The backend command here never migrates on startup, so rolling back to
# a previous image cannot fail on an unknown Alembic head.
#
# Networking: only the frontend (nginx) publishes host ports (80/443). Postgres,
# Redis and the backend are reachable only on the internal Docker network
# via their service names. No datastore or backend port is published.
#
# Persistence: every stateful service uses a named volume. Never run
# `docker compose down -v` — it would delete the database and TLS certificates.
# Uploaded objects live only in Cloudflare R2 / Google Drive; no upload volume.
name: freight_forwarding

services:
  postgres:
    container_name: ff-db
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - freight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]

  redis:
    container_name: ff-redis
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - freight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]

  backend:
    container_name: ff-api
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG}
    # Pull only through the workflow's explicit pre-pull; never implicitly while
    # recreating a healthy stack or starting a rollback image.
    pull_policy: never
    # Migrations are a deploy step, not a container startup step. This also
    # keeps an older rollback image from rejecting a newer alembic_version.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "*"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      # Internal wiring is fixed here; secrets/values come from /opt/lcs/.env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      TELEGRAM_PUBLIC_APP_URL: ${TELEGRAM_PUBLIC_APP_URL:-}
      TELEGRAM_WORKER_ENABLED: ${TELEGRAM_WORKER_ENABLED:-true}
      # Production must receive updates through the registered HTTPS webhook.
      # Hard-set (not env-overridable) so a development .env cannot leak polling.
      TELEGRAM_UPDATE_MODE: "webhook"
      TELEGRAM_ALLOW_WEBHOOK_DELETE: "false"
      TELEGRAM_API_HEALTH_URL: http://127.0.0.1:8000/health
      AUTH_RETURN_TOKENS: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-480}
      SESSION_ABSOLUTE_TIMEOUT_MINUTES: ${SESSION_ABSOLUTE_TIMEOUT_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      SESSION_REFRESH_TOKEN_EXPIRE_HOURS: "12"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_MAX_LENGTH: "20"
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: lcslog.minidev.in
      COOKIE_SECURE: "true"
      ACCESS_COOKIE_NAME: __Host-access_token
      REFRESH_COOKIE_NAME: __Secure-refresh_token
      CSRF_COOKIE_NAME: __Host-XSRF-TOKEN
      FORWARDED_ALLOW_IPS: "*"
      # File attachment storage (Cloudflare R2 / Google Drive) is configured
      # and encrypted in the database via Settings → Storage & Backup. Uploads
      # are processed in memory and written directly to the cloud; no uploaded
      # object is stored on a Docker volume.
      STORAGE_PRESIGNED_UPLOADS_ENABLED: "false"
      UPLOAD_MAX_SIZE_MB: "20"
      PRESIGNED_URL_EXPIRE_SECONDS: "300"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The API rejects unknown Host headers (ALLOWED_HOSTS hardening), and
      # production deliberately forbids localhost there, so the in-container
      # probe must send the public hostname.
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': 'lcslog.minidev.in'}); urllib.request.urlopen(r, timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app, data]

  frontend:
    container_name: ff-frontend
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
    # Same as backend: the workflow pre-pulls, rollback uses local images.
    pull_policy: never
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The only service that publishes host ports.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS + SPA + API proxy (deployed by the workflow).
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared with certbot: read-only certificate store + ACME webroot.
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  # One-shot helper (profile "tools"): certificate issuance/renewal only.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [app]

volumes:
  freight_postgres_data:
  freight_redis_data:
  certbot_etc:
  certbot_www:

networks:
  app:
  data:
    internal: true
