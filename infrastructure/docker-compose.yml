name: freight_forwarding

services:
  postgres:
    container_name: ff-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freight_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-freight}
    ports:
      # BIND_HOST defaults to all interfaces for local dev; set BIND_HOST=127.0.0.1
      # in production so the datastores are not reachable from the internet.
      - "${BIND_HOST:-0.0.0.0}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - freight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freight} -d ${POSTGRES_DB:-freight}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    container_name: ff-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-0.0.0.0}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - freight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    container_name: ff-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${MINIO_HOST_PORT:-9000}:9000"
      - "${BIND_HOST:-0.0.0.0}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - freight_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: ff-api
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freight}:${POSTGRES_PASSWORD:-freight_dev_password}@postgres:5432/${POSTGRES_DB:-freight}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-32-byte-minimum-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Comma-separated browser origins allowed to call the API over CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:${FRONTEND_HOST_PORT:-80},http://127.0.0.1:${FRONTEND_HOST_PORT:-80}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_LOCAL_PATH: /app/storage
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Browser-facing endpoint used to sign upload/download URLs.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${MINIO_HOST_PORT:-9000}}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-freight-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - freight_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    container_name: ff-frontend
    build:
      context: ../frontend
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_AUTH_MODE: ${NUXT_PUBLIC_AUTH_MODE:-cookie}
    ports:
      # Public HTTP. The HTTPS (443) mapping is added by docker-compose.prod.yml.
      - "${FRONTEND_HOST_PORT:-80}:80"
    volumes:
      # default.conf = HTTP (local / TLS bootstrap); production.conf = HTTPS.
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  freight_postgres_data:
  freight_redis_data:
  freight_minio_data:
  freight_uploads:
