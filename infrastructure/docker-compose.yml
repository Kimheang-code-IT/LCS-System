name: freight_forwarding

services:
  postgres:
    container_name: ff-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freight_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-freight}
    ports:
      # BIND_HOST defaults to all interfaces for local dev; set BIND_HOST=127.0.0.1
      # in production so the datastores are not reachable from the internet.
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - freight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freight} -d ${POSTGRES_DB:-freight}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    container_name: ff-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - freight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    container_name: ff-api
    build:
      context: ../backend
    # Local dev keeps the convenience auto-migration on startup. Production
    # (docker-compose.prod.yml) runs migrations explicitly before switching images.
    command:
      - "sh"
      - "-c"
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freight}:${POSTGRES_PASSWORD:-freight_dev_password}@postgres:5432/${POSTGRES_DB:-freight}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-32-byte-minimum-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-480}
      SESSION_ABSOLUTE_TIMEOUT_MINUTES: ${SESSION_ABSOLUTE_TIMEOUT_MINUTES:-1440}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      TELEGRAM_PUBLIC_APP_URL: ${TELEGRAM_PUBLIC_APP_URL:-}
      TELEGRAM_WORKER_ENABLED: ${TELEGRAM_WORKER_ENABLED:-true}
      # Local development consumes updates by polling. A registered webhook
      # blocks polling unless explicitly allowed (protects a shared production
      # bot); prefer a separate development bot token.
      TELEGRAM_UPDATE_MODE: ${TELEGRAM_UPDATE_MODE:-polling}
      TELEGRAM_ALLOW_WEBHOOK_DELETE: ${TELEGRAM_ALLOW_WEBHOOK_DELETE:-false}
      TELEGRAM_API_HEALTH_URL: http://127.0.0.1:8000/health
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      SESSION_REFRESH_TOKEN_EXPIRE_HOURS: ${SESSION_REFRESH_TOKEN_EXPIRE_HOURS:-12}
      # Backstop for Casbin policy reloads when Redis cannot publish a change.
      CASBIN_RELOAD_INTERVAL_SECONDS: ${CASBIN_RELOAD_INTERVAL_SECONDS:-30}
      # Comma-separated browser origins allowed to call the API over CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:${FRONTEND_HOST_PORT:-80},http://127.0.0.1:${FRONTEND_HOST_PORT:-80}}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # File attachment storage lives in Settings → Storage & Backup (R2/Drive);
      # uploads are processed in memory and written directly to the cloud.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    container_name: ff-frontend
    build:
      context: ../frontend
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_AUTH_MODE: ${NUXT_PUBLIC_AUTH_MODE:-cookie}
    ports:
      # Public HTTP. Published on all host interfaces on purpose so other
      # machines on the LAN can reach it (see section 19 of
      # docs/archive/deployment-security-history.md). The HTTPS (443) mapping is added by
      # docker-compose.prod.yml.
      - "${FRONTEND_HOST_PORT:-80}:80"
    volumes:
      # default.conf = HTTP (local / TLS bootstrap); production.conf = HTTPS.
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  freight_postgres_data:
  freight_redis_data:
