# Production nginx config: HTTPS for the app (lcslog.minidev.in) and the MinIO
# S3 API (storage.lcslog.minidev.in) that the browser talks to for attachments.
#
# Enable with NGINX_CONF=production.conf in infrastructure/.env, and provide a
# certificate covering BOTH names (see docs / runbook: certbot certonly ...).
# Replace the domain below if you deploy under a different hostname.

# --- HTTP: ACME challenge + redirect everything else to HTTPS --------------
server {
    listen 80 default_server;
    server_name lcslog.minidev.in storage.lcslog.minidev.in _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Application (SPA + API) ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lcslog.minidev.in;

    ssl_certificate     /etc/letsencrypt/live/lcslog.minidev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcslog.minidev.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API -> FastAPI backend (same origin from the browser's point of view).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Backend health endpoints (handy for uptime checks through the frontend).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    # Hashed Nuxt assets - cache aggressively.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static files first, otherwise fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- MinIO S3 API (presigned attachment upload/download) -------------------
# Signature validation uses the Host header, so it MUST be forwarded unchanged.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storage.lcslog.minidev.in;

    ssl_certificate     /etc/letsencrypt/live/lcslog.minidev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcslog.minidev.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
