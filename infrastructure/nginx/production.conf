# Production nginx config: HTTPS for the app (lcslog.minidev.in).
# File attachment storage (Cloudflare R2 / Google Drive) is configured in
# Settings → Storage & Backup; attachment downloads stream through the backend
# API, so no object-storage proxy exists here.
#
# Replace the domain below if you deploy under a different hostname.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# --- HTTP: ACME challenge + redirect everything else to HTTPS --------------
server {
    listen 80 default_server;
    server_name lcslog.minidev.in _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lcslog.minidev.in$request_uri;
    }
}

# --- Application (SPA + API) ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lcslog.minidev.in;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lcslog.minidev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcslog.minidev.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    # API -> FastAPI backend (same origin from the browser's point of view).
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_hide_header Server;
    }

    # Backend health endpoints (handy for uptime checks through the frontend).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    # Hashed Nuxt assets - cache aggressively.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Static files first, otherwise fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
