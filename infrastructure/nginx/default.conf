# Nginx config for the static (SPA) frontend.
# Serves the generated Nuxt output and proxies the API to the backend service
# so the browser talks to a single origin (no CORS, no Node runtime).

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers (mirrors the previous Nuxt route rules).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    # Let's Encrypt HTTP-01 challenge (served while bootstrapping TLS).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API -> FastAPI backend (same origin from the browser's point of view).
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $http_host keeps a non-default port, so the CSRF origin check and
        # request.base_url match the browser Origin on a LAN address.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_hide_header Server;
    }

    # Backend health endpoints (handy for uptime checks through the frontend).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    # MinIO S3 API for browser presigned upload/download, so a LAN client never
    # needs a host port on MinIO. Set S3_PUBLIC_ENDPOINT_URL to the same origin
    # as the SPA (e.g. http://192.168.1.15) or the SigV4 signature fails.
    # NOTE: keep this path in sync with S3_BUCKET (default: freight-attachments).
    location /freight-attachments/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header Server;
        proxy_hide_header X-Minio-Error-Code;
        proxy_hide_header X-Minio-Error-Desc;
    }

    # Hashed Nuxt assets - cache aggressively.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Static files first, otherwise fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
